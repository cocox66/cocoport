<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Coco Xia</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap');
:root{
  --paper:#fdf7fa;--paper2:#f4e9ef;--ink:#3a2530;--soft:#7a6670;
  --cardinal:#d24d74;--jay:#b0466f;--finch:#c88f18;--leaf:#5c7048;--spruce:#16302a;--chick:#8a8279;
  --bubtext:#7a2b4e;--line:rgba(58,37,48,.14);
  --mono:'Cormorant Garamond','Noto Serif SC',Georgia,serif;
  --sans:'IBM Plex Sans','Noto Serif SC',ui-sans-serif,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--mono);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-family:var(--mono);font-weight:500;letter-spacing:-.02em}
p{margin:0 0 1rem}a{color:inherit}em{font-style:italic}button{font-family:inherit}

/* ---------- HUB ---------- */
.hub{position:relative;min-height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;background:
  radial-gradient(rgba(180,150,165,.08) 1px, transparent 1px) 0 0/24px 24px,
  radial-gradient(130% 130% at 50% 22%, #fffdfe 0%, #fdf7fa 55%, #faf1f5 100%)}
body.in-view .hub,body.in-view #landing,body.in-view .home-foot,body.in-view .scroll-cue{display:none}
.scroll-cue{position:fixed;bottom:20px;left:50%;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--soft);font-family:var(--mono);font-style:italic;font-size:.72rem;letter-spacing:.08em;z-index:6;pointer-events:none;transition:opacity .4s ease;animation:scrollcue 1.9s ease-in-out infinite}
.scroll-cue.hide{opacity:0}
@keyframes scrollcue{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(8px)}}
/* landing gallery + fly-in */
#landing{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;padding:7vh clamp(18px,5vw,70px)}
.galleryLand{display:flex;gap:16px;align-items:flex-start;width:100%;max-width:1120px;margin:0 auto}
@media(max-width:860px){.galleryLand{columns:2}}
@media(max-width:520px){.galleryLand{columns:1}}
.flyt{opacity:0;transform:translateX(var(--fx,0));transition:opacity .9s ease var(--d,0s),transform 1.05s cubic-bezier(.28,.7,.3,1) var(--d,0s)}
.galleryLand.in .flyt{opacity:1;transform:translateX(0)}
/* ornate laurel frame on photos */
.tframe{position:absolute;inset:0;pointer-events:none;border-radius:12px;box-shadow:inset 0 0 0 1.5px rgba(198,120,158,.55)}
.tframe::after{content:'';position:absolute;inset:6px;border:1px solid rgba(214,150,180,.45);border-radius:8px}
.tframe .cn{position:absolute;width:34px;height:34px}
.tframe .cn .sprig{width:100%;height:100%;display:block}
.tframe .cn.tl{left:3px;top:3px}
.tframe .cn.tr{right:3px;top:3px;transform:scaleX(-1)}
.tframe .cn.bl{left:3px;bottom:3px;transform:scaleY(-1)}
.tframe .cn.br{right:3px;bottom:3px;transform:scale(-1,-1)}
/* hummingbird intro overlay */
.introlayer{position:fixed;inset:0;z-index:60;background:var(--paper);transition:opacity .6s ease}
/* mini laurel ring around each bubble */
.bubwr{position:absolute;inset:-13px;width:calc(100% + 26px);height:calc(100% + 26px);pointer-events:none;z-index:0}
/* greeting + clickable identity list */
.intro-copy{position:relative;z-index:2;text-align:center;max-width:640px;margin:0 auto;padding:0 24px}
.tw::after{content:'';display:inline-block;width:.5ch;height:.82em;background:var(--cardinal);margin-left:.04em;vertical-align:-.05em;animation:blink 1.1s steps(1) infinite}
/* content-creator two-column */
.creator-grid{display:grid;grid-template-columns:1fr .82fr;gap:44px;align-items:center;max-width:1040px}
.creator-right{display:flex;flex-direction:column;align-items:center;justify-content:center}
.creator-right img{width:100%;max-width:340px;border-radius:16px;border:1px solid var(--line);box-shadow:0 14px 34px rgba(120,90,110,.18)}
@media(max-width:820px){.creator-grid{grid-template-columns:1fr;gap:28px}.creator-right img{max-width:300px}}
.greet{font-family:var(--mono);font-weight:600;font-size:clamp(2.2rem,6vw,4rem);line-height:1.05;color:var(--ink)}
.greet-sub{font-family:var(--mono);font-style:italic;font-size:clamp(1.1rem,2.6vw,1.6rem);color:var(--soft);margin:.6rem 0 1.8rem}
.idlist{list-style:none;display:flex;flex-direction:column;gap:.55rem;align-items:center}
.idlink{background:none;border:none;cursor:pointer;font-family:var(--mono);font-size:clamp(1.4rem,3.4vw,2.1rem);color:var(--ink);padding:.1rem .2rem;transition:color .2s}
.idlink::before{content:'❧ ';color:rgba(198,120,158,.8);font-size:.85em}
.idand{font-family:var(--mono);font-style:italic;color:var(--soft);font-size:1.05rem}
.idlink:hover,.idlink:focus-visible{color:var(--cardinal);text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px;outline:none}
.hub__name{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:2}
#net{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
.caret{display:inline-block;width:.5ch;height:.92em;background:var(--jay);margin-left:.14em;transform:translateY(.08em);animation:blink 1.1s steps(1) infinite}
.caret.steady{animation:none;opacity:1}
@keyframes blink{50%{opacity:0}}
.hub__name h1{font-size:clamp(2.4rem,6.5vw,4.4rem);line-height:1}
.bubble{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;
cursor:pointer;user-select:none;z-index:3;color:#fff;
background:radial-gradient(circle at 30% 25%, rgba(255,255,255,.9), rgba(255,255,255,.15) 30%, transparent 45%),
linear-gradient(145deg,#f8f3ef,#eadfdc 40%,#d8c7c7 100%);
box-shadow:0 12px 28px rgba(120,90,110,.18), inset 0 3px 10px rgba(255,255,255,.9), inset 0 -10px 18px rgba(180,150,150,.25);
transition:all .3s ease}
.bubble::before{content:'';position:absolute;inset:0;border-radius:42%;
background:radial-gradient(circle at center, transparent 68%, rgba(255,248,245,.95) 69%, rgba(225,205,195,.95) 78%, transparent 79%);
}
.bubble::after{content:'';position:absolute;inset:4px;border-radius:40%;box-shadow:inset 0 0 18px rgba(130,100,110,.12)}
.bubble-label{position:absolute;opacity:0;transition:opacity .25s ease;font-family:var(--mono);font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;color:#5f4a54;z-index:2}
.bubble:hover{filter:saturate(1.05);transform:translateY(-2px) scale(1.03)}
.bubble:hover .bubble-label{opacity:1}
.bubble:hover::after{background:rgba(255,255,255,.28)}
.bubble.grabbing{cursor:grabbing}
.bubble,.hub__name{transition:box-shadow .2s,filter .2s,opacity .7s ease}
.hub--intro .bubble,.hub--intro .hub__name{opacity:0}
.flock{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden}
.birdfig{position:absolute;z-index:1;pointer-events:none;overflow:visible}
.flybird{position:absolute;top:50%;left:50%;width:150px;margin:-56px 0 0 -75px;animation:flyacross 3.6s cubic-bezier(.4,0,.5,1) forwards}
@keyframes flyacross{0%{transform:translate(-82vw,14vh) scale(.72) rotate(-3deg);opacity:0}10%{opacity:1}50%{transform:translate(0,-7vh) scale(1) rotate(0deg)}90%{opacity:1}100%{transform:translate(84vw,12vh) scale(.82) rotate(4deg);opacity:0}}
.fbwing{transform-box:fill-box;transform-origin:34% 72%;animation:flap .13s ease-in-out infinite alternate}
@keyframes flap{from{transform:rotate(-11deg)}to{transform:rotate(10deg)}}

/* ---------- VIEWS ---------- */
.view{display:none;min-height:100vh;animation:viewIn .5s ease both}
.view.active{display:block}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.back{position:fixed;top:18px;left:clamp(16px,4vw,40px);z-index:30;display:inline-flex;align-items:center;gap:8px;
  background:rgba(253,247,250,.85);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:30px;
  padding:8px 16px 8px 12px;font-family:var(--mono);font-size:.82rem;color:var(--ink);cursor:pointer;transition:background .2s,color .2s}
.back:hover{background:var(--ink);color:var(--paper)}
.band{padding:clamp(80px,10vw,120px) clamp(20px,6vw,90px) clamp(60px,8vw,100px)}
.band--dark{background:var(--spruce);color:#f2ede1}
.band--writing{position:relative;overflow:hidden}
.wrap{max-width:1040px;margin:0 auto}

.plate{display:flex;align-items:center;gap:14px;margin-bottom:2.4rem}
.plate .bird{flex:none;transform:rotate(-6deg)}
.plate__name{font-size:clamp(1.7rem,4vw,2.4rem)}
.plate__rule{flex:1;height:1px;background:currentColor;opacity:.22}
.plate__note{font-family:var(--mono);font-style:italic;font-size:.9rem;opacity:.7;flex:none}

/* apps — specimen list */
.spec{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:start;padding:26px 4px;border-top:1px solid var(--line)}
.spec:last-child{border-bottom:1px solid var(--line)}
.spec__bird{flex:none;padding-top:4px}
.spec h3{font-size:1.35rem;margin-bottom:.35rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spec p{color:var(--soft);margin-bottom:.7rem;max-width:52ch}
.spec__meta{font-family:var(--mono);font-size:.78rem;color:var(--jay);font-weight:600;letter-spacing:.02em}
.spec__links{display:flex;flex-direction:column;gap:8px;text-align:right}
.spec__links a{display:inline-flex;align-items:center;gap:4px;justify-content:flex-end;font-family:var(--mono);font-size:.82rem;font-weight:600;text-decoration:none;border-bottom:1px solid transparent;white-space:nowrap}
.spec__links a:hover{border-color:var(--ink)}
.chip{font-family:var(--mono);font-size:.66rem;font-weight:600;color:var(--finch);background:rgba(200,143,24,.14);padding:2px 9px;border-radius:20px}

/* research */
.poster{display:grid;grid-template-columns:1.1fr 1fr;gap:36px;align-items:start;margin-top:3rem}
.poster__frame{display:block;border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:transform .2s,box-shadow .2s}
.poster__frame:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(120,90,110,.18)}
.poster__frame img{width:100%;display:block}
.poster__pdf{display:inline-flex;align-items:center;gap:5px;margin-top:14px;font-family:var(--mono);font-size:.82rem;color:var(--cardinal);text-decoration:none;border-bottom:1px solid currentColor}
.poster__text h3{font-size:1.4rem;margin-bottom:.5rem;line-height:1.25}
.poster__title{font-family:var(--mono);font-style:italic;font-size:.82rem;color:var(--soft);margin-bottom:1.1rem;display:block}
.poster__text p{color:var(--soft)}
.link{background:none;border:none;padding:0;font-family:var(--mono);font-weight:500;color:var(--cardinal);cursor:pointer;border-bottom:1px solid currentColor;font-size:.88rem}

/* writing — typed manuscript */
.piece{max-width:64ch}
.piece + .piece{margin-top:3.2rem;padding-top:3.2rem;border-top:1px solid var(--line)}
.piece__title{font-size:1.9rem}
.piece__sub{font-family:var(--mono);font-style:italic;color:var(--soft);margin-bottom:1.4rem;font-size:.9rem}
.piece__body{font-family:var(--mono);font-size:1.02rem;line-height:1.85}.piece__body p{margin-bottom:1.2rem}
.piece__more{display:none}.piece__more.show{display:block}
.ptype{min-height:1.6em}
.ptype.typing::after{content:'';display:inline-block;width:.55ch;height:1em;background:var(--jay);margin-left:1px;vertical-align:-.12em;animation:blink 1.1s steps(1) infinite}
.glide{position:absolute;top:14%;left:-80px;filter:drop-shadow(0 8px 12px rgba(42,35,32,.14))}
.glide.run{animation:glideAcross 6s ease-in-out forwards}
@keyframes glideAcross{0%{transform:translateX(0) rotate(-4deg);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(115vw) rotate(-4deg);opacity:0}}

/* field */
.field__intro{font-size:1.12rem;max-width:56ch;color:#dcd5c6;margin-bottom:2.4rem}
.stats{display:flex;gap:clamp(24px,6vw,72px);flex-wrap:wrap;margin-bottom:2.8rem}
.stats strong{font-family:var(--mono);font-size:2.4rem;display:block;color:#f2ede1}
.stats span{font-family:var(--mono);font-size:.82rem;color:#b9b0a0;max-width:22ch;display:block}
.stats a{color:#f2ede1;text-decoration:underline;text-underline-offset:2px}
.gallery{display:flex;gap:16px;align-items:flex-start}
.gcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
.gallery-head{text-align:center;font-family:var(--mono);font-size:1.35rem;color:#f2ede1;margin:1.2rem 0 1.4rem}
.tile{width:100%;border:none;padding:0;cursor:pointer;border-radius:14px;position:relative;overflow:hidden;display:block;background:none}
.tile img{width:100%;display:block;border-radius:14px;transition:filter .3s,transform .3s}
.tile:hover img,.tile:focus-visible img{filter:brightness(.58);transform:scale(1.02)}
.tile__cap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center;color:#fff;font-family:var(--mono);opacity:0;transition:opacity .3s;padding:14px;text-shadow:0 1px 8px rgba(0,0,0,.45)}
.tile:hover .tile__cap,.tile:focus-visible .tile__cap{opacity:1}
.tile__cap strong{font-size:1rem;font-weight:600}
.tile__cap em{font-style:normal;font-weight:400;font-size:.8rem;color:#f2eaee;display:inline-flex;align-items:center;gap:4px}

/* about */
.about__body{font-family:var(--mono);font-size:1.32rem;max-width:60ch;color:var(--ink);line-height:1.55;margin-bottom:2.2rem}
.links{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;border:1px solid var(--line);border-radius:30px;padding:9px 18px;font-family:var(--mono);font-size:.85rem;font-weight:500;transition:background .2s,color .2s,border-color .2s}
.btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* maps */
.map-panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:2.4rem;box-shadow:0 8px 22px rgba(120,90,110,.08)}
.map{position:relative;width:100%;aspect-ratio:1000/386;background:url(images/world.svg) center/contain no-repeat}
.pin{position:absolute;transform:translate(-50%,-50%);background:none;border:none;padding:0;cursor:pointer;z-index:1}
.pin:hover,.pin.active{z-index:20}
.pin__dot{display:block;width:11px;height:11px;border-radius:50%;background:var(--cardinal);box-shadow:0 0 0 3px rgba(210,77,116,.22);transition:transform .15s}
.pin:hover .pin__dot,.pin.active .pin__dot{transform:scale(1.35)}
.pin__label{position:absolute;left:50%;top:11px;transform:translateX(-50%);white-space:nowrap;font-family:var(--mono);font-size:.6rem;color:var(--soft);pointer-events:none}
.pin__card{position:absolute;left:50%;bottom:18px;transform:translateX(-50%) translateY(6px);opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:.72rem;line-height:1.45;padding:8px 11px;border-radius:9px;width:max-content;max-width:220px;text-align:left}
.pin:hover .pin__card,.pin.active .pin__card{opacity:1;transform:translateX(-50%) translateY(0)}

/* light stats + creator handle */
.stats--light strong{color:var(--ink)}
.stats--light span{color:var(--soft)}
.handle{font-family:var(--mono);font-size:.85rem;color:var(--soft)}
.contact-label{font-family:var(--mono);font-style:italic;font-size:.85rem;color:var(--soft);margin-bottom:.8rem}
.home-foot{display:flex;justify-content:center;gap:16px;padding:0 24px 72px;background:var(--paper);opacity:0;transition:opacity .8s ease}
.home-foot.in{opacity:1}
.ipline{font-size:.82rem;color:var(--soft);text-align:center;margin-top:1.4rem}
.ipline a{color:var(--cardinal);text-decoration:none;border-bottom:1px solid currentColor}
.band--dark .ipline{color:#b9b0a0}
.band--dark .ipline a{color:#e8c7d5}
.rednote-cap{text-align:center;font-style:italic;color:var(--soft);font-size:.9rem;margin-top:.9rem}
.home-foot a{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:1px solid var(--line);border-radius:50%;color:var(--ink);transition:background .2s,color .2s}
.home-foot a:hover{background:var(--ink);color:var(--paper)}
.home-foot a svg{width:18px;height:18px}

/* in-press credential */
.inpress{margin-top:2.6rem;padding-top:2rem;border-top:1px solid var(--line)}
.inpress h3{font-size:1.4rem;line-height:1.25;margin:.5rem 0 .4rem}
.inpress p{color:var(--soft);max-width:58ch}

/* lightbox */
.lb{position:fixed;inset:0;z-index:70;background:rgba(22,17,14,.8);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:24px}
.lb.open{display:flex}
.lb__x{position:absolute;top:20px;right:22px;background:none;border:none;color:#fff;cursor:pointer}
.lb__panel{background:var(--paper);border-radius:18px;padding:18px;max-width:680px;width:100%;text-align:center}
.lb__panel img{width:100%;border-radius:12px;display:block}
.lb__cap{margin-top:12px;display:flex;flex-direction:column;gap:4px}
.lb__cap strong{font-family:var(--mono);font-size:1.25rem}
.lb__cap span{display:inline-flex;align-items:center;justify-content:center;gap:5px;color:var(--soft);font-family:var(--mono);font-size:.85rem}

@media(max-width:860px){.poster{grid-template-columns:1fr;gap:22px}
  .spec{grid-template-columns:auto 1fr}.spec__links{grid-column:2;flex-direction:row;text-align:left;gap:16px}.spec__links a{justify-content:flex-start}
  .gallery{columns:2}}
@media(max-width:520px){.gallery{columns:1}}
body.reduced .hub{display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:16px}
body.reduced .bubble{position:relative!important;left:auto!important;top:auto!important}
body.reduced .hub__name{position:relative;transform:none;flex-basis:100%;margin-bottom:10px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style>
</head>
<body>

<section id="landing"><div class="galleryLand" id="galleryLand"></div><p class="ipline">All photos © Coco Xia; please ask before using: <a href="mailto:cocoxia@stanford.edu">cocoxia@stanford.edu</a></p></section>
<div class="scroll-cue" id="scrollCue"></div>

<section class="hub" id="hub">
  <div class="intro-copy">
    <h1 class="greet"><span id="greetType"></span></h1>
    <p class="greet-sub" id="greetSub"></p>
    <ul class="idlist" id="idlist"></ul>
  </div>
</section>

<footer class="home-foot" id="homeFoot"></footer>

<main id="views"></main>

<div class="lb" id="lb"><button class="lb__x" aria-label="Close"><span class="ic" data-ic="x"></span></button><div class="lb__panel" id="lbPanel"></div></div>

<script>
/* ============================================================
   ✏️  EDIT YOUR SITE HERE  —  everything you'd ever change lives
   in this CONFIG object. Below the ⚙️ line is the engine; leave it.
   Bird glyph options: cardinal, bluejay, goldfinch, chickadee, robin, bunting.
   A bubble's section opens a view: apps, research, writing, field, about.
   To leave a photo location blank, set place:"".
   ============================================================ */
const CONFIG = {
  name: "Coco Xia",

  bubbles: [
    { label: "Birdwatcher",     section: "field",    color: "#ffdbe8", size: 66 },
    { label: "Researcher",      section: "research", color: "#f9cfe0", size: 64 },
    { label: "Builder",         section: "apps",     color: "#ffe0ec", size: 56 },
    { label: "Writer",          section: "writing",  color: "#fbd3e2", size: 56 },
    { label: "Content creator", section: "creator",  color: "#f8d8e6", size: 74 },
    { label: "Student",         section: "student",  color: "#f6c8dd", size: 54 },
  ],

  apps: {
    note: "things I’ve built",
    items: [
      { bird: "cardinal", name: "HummiBayes",
        desc: "I built this web app to help birdwatchers identify a hummingbird’s species using its wingbeat frequency. Based on Bayesian inference, the app matches the frequency to the most likely hummingbird species with confidence scores. HummiBayes can also pull the frequency straight out of an uploaded video, so you can point, shoot, and get an ID.",
        tech: "Bayesian inference · computer vision",
        code: "https://github.com/cocox66/hummiBayes_109", live: "https://hummi-bayes-109.vercel.app" },
      { bird: "bluejay", name: "Soundscape",
        desc: "I built this web app to spread conservation awareness by making it easier for people to birdwatch. Anyone can record on a patch of land, and Soundscape separates out the birdsong, predicts which species are present, and turns it into a picture of the area’s biodiversity. It also flags when what it hears doesn’t match what’s usually seen there.",
        tech: "bioacoustics · ML",
        code: "https://github.com/cocox66/soundscape", live: "https://www.youtube.com/watch?v=wu3Ybe9qZ3o&t=8s", liveLabel: "Demo" },

        more: `I realized that in my distant memories lay a particular shade of blue that fascinates me. It wasn’t quite like the blinding turquoise that made her life remarkable; it was a more gentle, velvety blend of sapphire and azure — the plumage of a cerulean warbler that would winter in the foothills of somewhere like Belize. In fact, it was the color of the waves in Pacuare Reserve, Costa Rica, a place that could pull me into tangled trains of thoughts every time I reminisced about the people I met, the dreams I had, the things I did and did not do. The ocean of Pacuare followed no rules. With each wave that crashed upon the dusky, sandy shore, the sea sang symphonies of sounds and echoed eternal rhythms of tides. The water unleashed its power at the beach, pouring, unrestrained, only to recede quietly into the sea, like a child’s apology to a careless wrongdoing, a lover’s tender retreat.` },

document.addEventListener('click',()=>document.querySelectorAll('.pin.active').forEach(x=>x.classList.remove('active')));

/* ---- shared framed tile (ornate laurel corners + double frame) ---- */
function sprigSVG(){return `<svg class="sprig" viewBox="0 0 46 46" aria-hidden="true"><path d="M4 4 C18 7 30 13 40 26" fill="none" stroke="rgba(198,120,158,.6)" stroke-width="1.3"/><path d="M11 8 q6 -4 11 -1 q-4 6 -11 1 Z" fill="rgba(214,150,180,.45)"/><path d="M18 12 q6 -4 11 -1 q-4 6 -11 1 Z" fill="rgba(214,150,180,.45)"/><path d="M26 18 q6 -3 11 0 q-4 6 -11 0 Z" fill="rgba(214,150,180,.45)"/><path d="M33 25 q5 -2 9 1 q-4 5 -9 -1 Z" fill="rgba(214,150,180,.45)"/></svg>`;}
function makeTile(p){const b=document.createElement('button');b.className='tile';
  b.innerHTML=`<img src="${p.src}" alt="${p.caption}" loading="lazy"><span class="tframe"></span><span class="tile__cap"><strong>${p.caption}</strong>${p.place?`<em>${iconSVG('pin',12)} ${p.place}</em>`:''}</span>`;
  b.addEventListener('click',()=>{document.getElementById('lbPanel').innerHTML=`<img src="${p.src}" alt="${p.caption}"><div class="lb__cap"><strong>${p.caption}</strong>${p.place?`<span>${iconSVG('pin',13)} ${p.place}</span>`:''}</div>`;document.getElementById('lb').classList.add('open');});
  return b;}

/* ---- galleries: real flex columns (round-robin) so column placement is controllable ---- */
const gallery=document.getElementById('gallery');
const gLand=document.getElementById('galleryLand');
const lb=document.getElementById('lb');lb.addEventListener('click',e=>{if(e.target===lb||e.target.closest('.lb__x'))lb.classList.remove('open');});
function colCount(){return innerWidth<560?1:innerWidth<900?2:3;}
function buildCols(container,animate){
  container.innerHTML='';const nc=colCount();const cols=[];
  for(let c=0;c<nc;c++){const d=document.createElement('div');d.className='gcol';container.appendChild(d);cols.push(d);}
  fn.photos.forEach((p,i)=>{const t=makeTile(p);
    if(animate){t.classList.add('flyt');if(!reduced)t.style.setProperty('--fx',((i%2?1:-1)*(60+Math.random()*35)).toFixed(0)+'vw');t.style.setProperty('--d',(i*0.05).toFixed(2)+'s');}
    cols[i%nc].appendChild(t);});
}
buildCols(gallery,false);
buildCols(gLand,true);
function flyGallery(){gLand.classList.add('in');}
let _rz;addEventListener('resize',()=>{clearTimeout(_rz);_rz=setTimeout(()=>{buildCols(gallery,false);buildCols(gLand,false);gLand.classList.add('in');},200);});
const scrollCue=document.getElementById('scrollCue');
if(scrollCue){let lv='';for(let k=0;k<16;k++){const a=(k/16*360).toFixed(1);lv+=`<path d="M0 0 Q3 -1.5 6.5 0 Q3 1.5 0 0 Z" fill="rgba(214,150,180,.55)" stroke="rgba(198,120,158,.6)" stroke-width=".4" transform="rotate(${a} 36 36) translate(36 9)"/>`;}
  scrollCue.innerHTML=`<svg width="56" height="56" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="23" fill="rgba(253,247,250,.85)"/><circle cx="36" cy="36" r="23" fill="none" stroke="rgba(198,120,158,.4)" stroke-width="1"/>${lv}<path d="M29 33 L36 40 L43 33" fill="none" stroke="#d24d74" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>scroll</span>`;}
addEventListener('scroll',()=>{if(scrollCue)scrollCue.classList.toggle('hide',scrollY>120);},{passive:true});

/* ---- clickable identity list (built empty, typed in sequence) ---- */
const idlist=document.getElementById('idlist');
const idItems=[];
["Birdwatcher","Student","Builder","Researcher","Content creator","Writer"].forEach(lb=>{
  const d=C.bubbles.find(x=>x.label===lb);if(!d)return;
  if(lb==='Writer'){const al=document.createElement('li');al.className='idand';al.style.display='none';const asp=document.createElement('span');al.appendChild(asp);idlist.appendChild(al);idItems.push({li:al,el:asp,disp:'and'});}
  const li=document.createElement('li');li.style.display='none';
  const b=document.createElement('button');b.className='idlink';
  b.addEventListener('click',()=>showView(d.section));
  li.appendChild(b);idlist.appendChild(li);
  idItems.push({li,el:b,disp:lb});
});
const homeFoot=document.getElementById('homeFoot');
if(homeFoot)homeFoot.innerHTML=C.student.contacts.map(l=>`<a href="${l.href}"${l.href.startsWith('mailto')?'':' target="_blank" rel="noopener"'} aria-label="${l.label}">${iconSVG(l.icon,18)}</a>`).join('');

/* ---- typewriter the whole intro, then fade in socials ---- */
const hubSec=document.getElementById('hub');
const greetEl=document.getElementById('greetType'), subEl=document.getElementById('greetSub');
function typeInto(el,text,speed,done){el.classList.add('tw');let i=0;(function s(){el.textContent=text.slice(0,i);if(i<text.length){i++;setTimeout(s,speed);}else{el.classList.remove('tw');done&&done();}})();}
function revealList(){
  idItems.forEach((it,idx)=>{it.el.textContent=it.disp;it.li.style.display='';it.li.style.opacity='0';it.li.style.transition='opacity .55s ease';setTimeout(()=>{it.li.style.opacity='1';},70*idx);});
  setTimeout(()=>{if(homeFoot)homeFoot.classList.add('in');},70*idItems.length+400);
}
function runIntro(){
  const steps=[{el:greetEl,t:"Hi, I’m Coco Xia.",s:85},{el:subEl,t:"I am a:",s:60}];
  (function go(k){if(k>=steps.length){revealList();return;}
    typeInto(steps[k].el,steps[k].t,steps[k].s,()=>go(k+1));})(0);
}
if(reduced){greetEl.textContent="Hi, I’m Coco Xia.";subEl.textContent="I am a:";idItems.forEach(it=>{it.li.style.display='';it.el.textContent=it.disp;});if(homeFoot)homeFoot.classList.add('in');}
else{let ran=false;new IntersectionObserver((es,o)=>{es.forEach(e=>{if(e.isIntersecting&&!ran){ran=true;runIntro();}});},{threshold:.4}).observe(hubSec);}

/* ---- intro: hummingbird flies across, then the gallery flies in (every load) ---- */
if(!reduced){
  const introlayer=document.createElement('div');introlayer.className='introlayer';
  const bd=document.createElement('div');bd.className='flybird';bd.innerHTML=hummingFlySVG();introlayer.appendChild(bd);
  document.body.appendChild(introlayer);
  setTimeout(()=>{introlayer.style.opacity='0';},2700);
  setTimeout(()=>{introlayer.remove();flyGallery();},3350);
}else{flyGallery();}

/* ---- navigation ---- */
function showView(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  const v=document.getElementById('view-'+id);if(!v)return;v.classList.add('active');document.body.classList.add('in-view');scrollTo(0,0);
  if(id==='field'||id==='creator')animateCounts(v);
  if(id==='writing'&&!reduced){const g=document.getElementById('glide');g.classList.remove('run');void g.offsetWidth;g.classList.add('run');}}
function typeWriting(){if(reduced)return;
  document.querySelectorAll('#view-writing .ptype').forEach(el=>{
    const full=el.dataset.full||el.textContent;el.dataset.full=full;
    if(el._twT)clearTimeout(el._twT);el.textContent='';el.classList.add('typing');
    let i=0;(function t(){el.textContent=full.slice(0,i);if(i<full.length){i++;el._twT=setTimeout(t,11);}else{el.classList.remove('typing');}})();
  });}
function closeView(){document.body.classList.remove('in-view');document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));const h=document.getElementById('hub');if(h)h.scrollIntoView();}
document.querySelectorAll('[data-back]').forEach(b=>b.addEventListener('click',closeView));
document.querySelectorAll('[data-toggle]').forEach(b=>b.addEventListener('click',()=>{const m=document.getElementById(b.dataset.toggle);const on=m.classList.toggle('show');b.textContent=on?b.dataset.l2:b.dataset.l1;}));

/* ---- count-ups (life list, follower stats) ---- */
function animateCounts(scope){scope.querySelectorAll('[data-count]').forEach(el=>{
  const target=+el.dataset.count, fmt=el.dataset.format, comma=el.dataset.comma!=null;
  const show=n=>fmt==='k'?(n/1000).toFixed(1)+'k':(comma?Math.round(n).toLocaleString('en-US'):Math.round(n).toString());
  if(reduced){el.textContent=show(target);return;}
  const start=performance.now();
  (function tick(t){const p=Math.min(1,(t-start)/1400);el.textContent=show(target*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(tick);})(start);
});}

</script>
